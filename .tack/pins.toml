# tack pins
# edit by hand or with tack add / rm / alias
# nix reads pins.lock.json
# this file drives tack update

[tack]
recomposable = true

[inputs]
nixpkgs.url = "github:NixOS/nixpkgs/nixos-26.05"
nixpkgs-unstable.url = "https://channels.nixos.org/nixpkgs-unstable/nixexprs.tar.xz"

[inputs.home-manager]
url = "github:nix-community/home-manager/release-26.05"
follows = { nixpkgs = "nixpkgs" }

[inputs.tack]
url = "github:manic-systems/tack"
follows = { nixpkgs = "nixpkgs-unstable"}

[inputs.mnw]
url = "github:Gerg-L/mnw"
